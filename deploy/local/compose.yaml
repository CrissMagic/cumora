services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cumora_local
      POSTGRES_USER: cumora_local
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run local-pc.ps1 Setup first}
    ports:
      - '127.0.0.1:15433:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cumora_local -d cumora_local']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:16379:6379'
    volumes:
      - redis:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres:
  redis:
